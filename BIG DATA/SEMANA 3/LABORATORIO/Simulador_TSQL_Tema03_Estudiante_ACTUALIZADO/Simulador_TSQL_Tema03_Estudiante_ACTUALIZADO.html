<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simulador T-SQL Tema 03</title>
<style>
/* =====================================================================
   COLORES Y TEXTOS BASE (el docente puede cambiar estos valores)
   Diseño de un solo tema claro, pensado para proyectar.
   Acento UPN: #FDBA30 (siempre con texto negro encima).
   ===================================================================== */
:root{
  color-scheme:light;
  --upn:#FDBA30; --upn-soft:#FFF4D6; --upn-line:#E7A300;
  --bg:#F3F3F0; --surface:#FFFFFF; --surface-2:#F8F8F5; --ink:#141414; --ink-2:#3B3B38;
  --muted:#5F5F5A; --line:#DCDBD4; --line-strong:#ADABA2;
  --concept:#6A1FB8; --concept-bg:#F4EEFC;
  --info:#0A5F99; --info-bg:#E7F3FB;
  --ok:#0B7A41; --ok-bg:#E2F3E9; --bad:#B8143A; --bad-bg:#FCE7EB; --warn-bg:#FFF4D6;
  --code-bg:#1E1E1E; --code-ink:#D4D4D4; --code-kw:#569CD6; --code-fn:#DCDCAA; --code-str:#CE9178;
  --code-num:#B5CEA8; --code-cm:#6A9955; --code-par:#9CDCFE;
  /* Series validadas para daltonismo (fondo claro) */
  --s-norte:#0090D6; --s-centro:#C98A00; --s-sur:#9500FF;
  --p0:#0090D6; --p1:#C98A00;
  --f:Arial,"Helvetica Neue",Helvetica,"Liberation Sans",sans-serif;
  --f-code:Consolas,"Cascadia Mono","SF Mono",Menlo,"Liberation Mono",monospace;
  --fs:16px;
}
:root.proj{--fs:20px}
*,*::before,*::after{box-sizing:border-box}
html{font-size:var(--fs)}
body{margin:0;background:var(--bg);color:var(--ink);font:1rem/1.55 var(--f);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--info);outline-offset:2px}
h1,h2,h3,h4{line-height:1.2;margin:0;text-wrap:balance}
p{margin:0 0 .7em;max-width:72ch}
code{font-family:var(--f-code);font-size:.9em;background:#EEEDE7;padding:.05em .35em;border-radius:3px}
small{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

/* ---------- Cabecera ---------- */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:#141414;color:#fff;border-bottom:5px solid var(--upn)}
.hdr-in{display:flex;align-items:center;gap:16px;padding:9px 20px;max-width:1500px;margin:0 auto}
.brand{display:flex;flex-direction:column;line-height:1.2;min-width:0}
.brand b{font-size:1.02rem}
.brand b span{color:var(--upn)}
.brand small{color:#BDBDB6;font-size:.76rem}
.where{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.where-t{font-size:.84rem;color:#C9C9C2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.where-t b{color:#fff}
.bar{height:7px;background:#333;border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--upn);transition:width .35s ease}
.pct{font-weight:700;font-size:.9rem;min-width:3.4em;text-align:right}
.hbtn{border:1.5px solid #666;background:transparent;color:#fff;border-radius:6px;padding:5px 10px;font-size:.8rem;cursor:pointer;white-space:nowrap}
.hbtn[aria-pressed="true"]{background:var(--upn);border-color:var(--upn);color:#000;font-weight:700}
.menu-btn{display:none}

/* ---------- Estructura ---------- */
.shell{display:grid;grid-template-columns:280px minmax(0,1fr);gap:26px;max-width:1500px;margin:0 auto;padding-block:20px 80px;padding-inline:20px}
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 74px);align-self:start;max-height:calc(100vh - 96px);overflow:auto;padding-right:4px}
.sess{font-size:.74rem;font-weight:700;color:var(--muted);margin:14px 10px 4px;letter-spacing:.04em}
.sess:first-child{margin-top:0}
.mod-btn{width:100%;display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;text-align:left;border:0;background:none;padding:8px 10px;border-radius:6px;cursor:pointer}
.mod-btn:hover{background:var(--surface)}
.mod-n{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:.78rem;border:2px solid var(--ink)}
.mod.cur .mod-n{background:var(--upn);border-color:var(--upn-line);color:#000}
.mod.full .mod-n{background:var(--ink);color:#fff}
.mod-t{font-weight:700;font-size:.93rem;line-height:1.2}
.mod-t small{display:block;font-weight:400;font-size:.75rem}
.mod-p{font-size:.76rem;color:var(--muted);font-variant-numeric:tabular-nums}
.steps{list-style:none;margin:2px 0 8px 24px;padding:0 0 0 14px;border-left:2px solid var(--line)}
.steps button{width:100%;text-align:left;border:0;background:none;padding:5px 8px;border-radius:5px;font-size:.85rem;color:var(--ink-2);cursor:pointer;display:flex;gap:8px;align-items:baseline}
.steps button:hover{background:var(--surface)}
.steps button[aria-current="true"]{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:inset 3px 0 0 var(--upn-line)}
.dot{flex:none;width:9px;height:9px;border-radius:50%;border:1.5px solid var(--line-strong);transform:translateY(1px)}
.dot.half{background:var(--upn);border-color:var(--upn-line)}
.dot.done{background:var(--ok);border-color:var(--ok)}
.rail-foot{font-size:.78rem;color:var(--muted);padding:10px;border-top:1px solid var(--line);margin-top:10px}
.linkbtn{border:0;background:none;padding:0;color:var(--bad);text-decoration:underline;cursor:pointer;font-size:inherit}

main{min-width:0}
.screen{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:28px 34px 32px}
.kicker{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:.82rem;color:var(--muted);margin-bottom:6px}
.pill{font-weight:700;border-radius:3px;padding:1px 8px;font-size:.74rem}
.pill.dark{background:var(--ink);color:#fff}
.pill.time{background:var(--upn);color:#000}
.pill.doc{background:var(--concept);color:#fff}
.screen h1{font-size:clamp(1.5rem,2.5vw,2.1rem);margin-bottom:6px;max-width:34ch}
.lead{font-size:1.05rem;color:var(--ink-2);margin-bottom:6px}
.stack{display:flex;flex-direction:column;gap:22px;margin-top:20px}

/* ---------- Secuencia didáctica ---------- */
.blk{position:relative;border:1px solid var(--line);border-radius:6px;padding:16px 20px 18px;background:var(--surface)}
.blk>header{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.blk>header .n{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:.76rem;font-weight:700;flex:none;background:var(--ink);color:#fff}
.blk>header .lab{font-size:.76rem;font-weight:700;letter-spacing:.04em;color:var(--muted)}
.blk>header h3{font-size:1.08rem;margin:0}
.blk.sit{background:var(--surface-2)}
.blk.con{background:var(--concept-bg);border-color:transparent}
.blk.con>header .n{background:var(--concept)}
.blk.pred{border:2px solid var(--upn-line);background:var(--upn-soft)}
.blk.pred>header .n{background:var(--upn);color:#000}
.blk.int{border:2px solid var(--ink)}
.blk.res{background:var(--ok-bg);border-color:transparent}
.blk.res>header .n{background:var(--ok)}
.blk.expl{background:var(--surface-2)}
.blk.colab{background:#F1F1EC}
.blk.colab>header .n{background:#3B3B38}
.blk.doc{border:2px dashed var(--concept);background:var(--concept-bg)}
.blk.doc>header .n{background:var(--concept)}
.blk.solved{border-color:var(--ok)!important}
.blk ul,.blk ol{margin:.2em 0 .8em;padding-left:1.3em;max-width:72ch}
.blk li{margin:.25em 0}
details.more{margin-top:8px;border-top:1px solid var(--line);padding-top:8px}
details.more summary{cursor:pointer;font-weight:700;color:var(--info);font-size:.92rem}
details.more[open] summary{margin-bottom:8px}
.key{margin-top:10px;padding:10px 14px;background:var(--surface);border-left:4px solid var(--upn-line);border-radius:0 5px 5px 0;max-width:76ch}
.sim-tag{display:inline-block;font-size:.72rem;font-weight:700;border:1.5px solid var(--ink);border-radius:3px;padding:0 6px;margin-bottom:8px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}

/* ---------- Código ---------- */
.cw{margin:8px 0;border-radius:6px;overflow:hidden;background:var(--code-bg)}
.cbar{display:flex;justify-content:space-between;align-items:center;padding:6px 10px;background:#2D2D2D;color:#CFCFCF;font-size:.78rem}
.code{color:var(--code-ink);font:14px/1.6 var(--f-code);padding:12px 16px;margin:0;overflow-x:auto;white-space:pre;tab-size:4}
:root.proj .code{font-size:17px}
.code .kw{color:var(--code-kw)} .code .fn{color:var(--code-fn)} .code .st{color:var(--code-str)}
.code .nm{color:var(--code-num)} .code .cm{color:var(--code-cm)} .code .pa{color:var(--code-par)}
.code input.blank{font:inherit;background:#333337;color:#FFE08A;border:0;border-bottom:2px solid var(--upn);padding:0 4px;min-width:4ch;border-radius:2px}
.code input.blank.ok{border-bottom-color:#4EC98A;color:#A8F0C8}
.code input.blank.bad{border-bottom-color:#FF6B86;color:#FFB3C1}
.mini{border:1px solid var(--line-strong);background:var(--surface);border-radius:4px;padding:2px 9px;cursor:pointer;font-size:.8rem}
.cbar .mini{background:#3C3C3C;border-color:#5A5A5A;color:#fff}
.mini:disabled{opacity:.4;cursor:default}

/* ---------- Tablas ---------- */
.tw{overflow-x:auto;margin:6px 0}
table.rs{border-collapse:collapse;font-size:.9rem;min-width:100%}
table.rs th,table.rs td{padding:6px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
table.rs th{font-size:.78rem;color:var(--muted);border-bottom:2px solid var(--ink)}
table.rs .n{text-align:right;font-variant-numeric:tabular-nums}
table.rs tr.tot td{font-weight:700;background:var(--upn-soft)}
table.rs tr.hl td{background:var(--bad-bg)}
.null{font-family:var(--f-code);font-size:.8em;background:#ECEBE5;color:var(--muted);padding:1px 6px;border-radius:3px}

/* ---------- Actividades ---------- */
.q{font-weight:700;margin-bottom:10px;max-width:76ch}
.opts{display:grid;gap:8px;max-width:780px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;border:1.5px solid var(--line-strong);background:var(--surface);border-radius:6px;padding:8px 12px;cursor:pointer}
.opt:hover{border-color:var(--ink)}
.opt .mk{flex:none;width:18px;height:18px;border:2px solid var(--line-strong);border-radius:50%;margin-top:2px}
.opt.multi .mk{border-radius:4px}
.opt[aria-pressed="true"]{border-color:var(--ink);background:var(--upn-soft)}
.opt[aria-pressed="true"] .mk{background:var(--ink);border-color:var(--ink);box-shadow:inset 0 0 0 3px var(--surface)}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)} .opt.bad{border-color:var(--bad);background:var(--bad-bg)}
.opt.ok::after{content:"✓ correcta";margin-left:auto;font-size:.76rem;font-weight:700;color:var(--ok)}
.opt.bad::after{content:"✕ revisa";margin-left:auto;font-size:.76rem;font-weight:700;color:var(--bad)}
.grid-m{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.4fr);gap:8px 14px;align-items:center;max-width:980px}
.grid-m .it{padding:7px 10px;background:var(--surface-2);border:1px solid var(--line);border-radius:5px;font-size:.93rem}
select,input.f,textarea{border:1.5px solid var(--line-strong);background:var(--surface);border-radius:6px;padding:7px 10px;width:100%;min-width:0}
select.ok,input.f.ok,textarea.ok{border-color:var(--ok);background:var(--ok-bg)}
select.bad,input.f.bad,textarea.bad{border-color:var(--bad);background:var(--bad-bg)}
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px 14px;max-width:880px}
.fields label{display:flex;flex-direction:column;gap:4px;font-size:.86rem;color:var(--ink-2)}
.fields.wide{grid-template-columns:1fr}
textarea{min-height:80px;resize:vertical}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.btn{border:1.5px solid var(--ink);background:var(--surface);border-radius:6px;padding:7px 14px;font-weight:700;cursor:pointer;font-size:.9rem}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--upn);border-color:var(--upn-line);color:#000}
.btn.ghost{border-color:var(--line-strong)}
.btn.docb{border-color:var(--concept);color:var(--concept)}
.btn:disabled{opacity:.45;cursor:default}
.fb{margin-top:12px;padding:10px 14px;border-radius:6px;max-width:80ch;font-size:.95rem}
.fb.ok{background:var(--ok-bg);color:var(--ok)}
.fb.bad{background:var(--bad-bg);color:var(--bad)}
.fb ul{margin:.3em 0 0;padding-left:1.2em;color:var(--ink)}
.fb .ttl{font-weight:700}
.hint{margin-top:10px;padding:10px 14px;border-radius:6px;background:var(--surface);border:1px solid var(--line);max-width:80ch}
.hint .h,.exp .h,.sol .h{display:block;font-size:.74rem;font-weight:700;margin-bottom:3px}
.hint .h{color:var(--info)}
.exp{margin-top:10px;padding:12px 14px;border-radius:6px;background:var(--info-bg);max-width:80ch}
.sol{margin-top:10px;padding:12px 14px;border-radius:6px;border:2px dashed var(--concept);background:var(--concept-bg);max-width:84ch}
.sol .h{color:var(--concept)}

/* ---------- Diagramas y simulaciones ---------- */
figure{margin:6px 0}
figure svg{display:block;width:100%;height:auto;max-width:100%}
figcaption{font-size:.84rem;color:var(--muted);margin-top:6px;max-width:76ch}
.fig-wrap{overflow-x:auto}
.svgt{font-family:var(--f);fill:currentColor}
.stage{border:1px solid var(--line);border-radius:6px;background:var(--surface-2);padding:14px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.tab{border:1.5px solid var(--line-strong);background:var(--surface);border-radius:99px;padding:4px 14px;cursor:pointer;font-weight:700;font-size:.86rem}
.tab[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.tab:disabled{opacity:.45;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line-strong);border-radius:99px;padding:3px 11px;font-size:.85rem;background:var(--surface);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:12px 14px}
.out{font-family:var(--f-code);font-size:.88rem;background:#141414;color:#E9E9E3;border-radius:6px;padding:10px 14px;white-space:pre-wrap;min-height:2.6em}
.out b{color:var(--upn)}

/* Piezas del entorno */
.envmap{display:grid;gap:10px}
.envbox{border:2px solid var(--ink);border-radius:8px;padding:10px 12px;background:var(--surface)}
.envbox>.t{font-weight:700;font-size:.82rem;color:var(--muted);margin-bottom:6px}
.envrow{display:flex;flex-wrap:wrap;gap:8px;align-items:stretch}
.piece{border:1.5px solid var(--line-strong);border-radius:6px;background:var(--surface-2);padding:7px 12px;cursor:pointer;font-weight:700;font-size:.9rem;text-align:left}
.piece[aria-pressed="true"]{background:var(--upn);border-color:var(--upn-line);color:#000}
.piece small{display:block;font-weight:400;color:var(--muted);font-size:.74rem}
.piece[aria-pressed="true"] small{color:#3a2a00}
.arrow-r{align-self:center;font-weight:700;color:var(--muted)}

/* Viajes y grupos (E01) */
.cards{display:flex;flex-wrap:wrap;gap:8px}
.tcard{border:1.5px solid var(--line-strong);background:var(--surface);border-radius:6px;padding:6px 10px;font-size:.86rem;min-width:118px;transition:transform .3s ease,opacity .3s ease}
.tcard b{display:block;font-size:.95rem}
.tcard.on{border-color:var(--ink);box-shadow:0 0 0 2px var(--upn)}
.tcard.dim{opacity:.35}
.buckets{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:12px}
.bucket{border:2px dashed var(--line-strong);border-radius:8px;padding:10px;min-height:150px;background:var(--surface)}
.bucket h4{font-size:.95rem;margin-bottom:6px}
.bucket .agg{font-family:var(--f-code);font-size:.85rem;margin-top:8px;padding-top:6px;border-top:1px solid var(--line)}
.colbtn{border:0;background:none;padding:0;font:inherit;font-weight:700;color:var(--info);text-decoration:underline dotted;cursor:pointer}

/* RDD (E02) */
.parts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.part{border:2px solid var(--p0);border-radius:8px;padding:10px;background:var(--surface)}
.part.p1{border-color:var(--p1)}
.part h4{font-size:.86rem;margin-bottom:6px;display:flex;justify-content:space-between;gap:8px}
.tup{display:inline-flex;gap:0;border:1.5px solid var(--line-strong);border-radius:6px;overflow:hidden;margin:3px;background:var(--surface);cursor:pointer;font-family:var(--f-code);font-size:.86rem;padding:0}
.tup span{padding:4px 8px}
.tup span+span{border-left:1px solid var(--line)}
.tup.on{border-color:var(--ink);box-shadow:0 0 0 2px var(--upn)}
.tup.pass{background:var(--ok-bg);border-color:var(--ok)}
.tup.drop{opacity:.3}
.plan{display:flex;flex-wrap:wrap;gap:8px;align-items:center;min-height:44px;padding:8px;border:2px dashed var(--line-strong);border-radius:8px;background:var(--surface)}
.node{border:1.5px dashed var(--ink);border-radius:6px;padding:4px 10px;font-family:var(--f-code);font-size:.84rem;background:var(--surface-2)}
.node.run{border-style:solid;background:var(--ok-bg);border-color:var(--ok)}
.shuffle{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;margin-top:10px}
.lanes{display:grid;gap:6px}
.lane{border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:var(--surface);font-family:var(--f-code);font-size:.84rem}

/* Calidad (E03) */
.rec{border:1.5px solid var(--line-strong);border-radius:6px;padding:8px 10px;background:var(--surface);font-family:var(--f-code);font-size:.84rem}
.reccards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.reccard{border:1.5px solid var(--line-strong);border-radius:8px;background:var(--surface);padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.reccard .rec{border:0;padding:0}
.reccard.ok{border-color:var(--ok)} .reccard.bad{border-color:var(--bad)}

/* Gráficos y reporte */
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:.82rem;color:var(--ink-2);margin-top:4px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.report{display:grid;grid-template-columns:1.6fr 1fr;gap:12px}
.tile{border:1px solid var(--line);border-radius:6px;padding:12px;background:var(--surface)}
.tile h5{margin:0 0 6px;font-size:.95rem}
.tile.wide{grid-column:1/-1}
.kpi{font-size:2.3rem;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.kpi-sub{font-size:.8rem;color:var(--muted)}
.funnel{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;align-items:stretch}
.fstep{border-radius:8px;padding:10px;text-align:center;border:1.5px solid var(--line-strong);background:var(--surface)}
.fstep strong{display:block;font-size:1.7rem;font-variant-numeric:tabular-nums}
.fstep span{font-size:.8rem;color:var(--muted)}
.fstep.y{background:var(--upn-soft);border-color:var(--upn-line)}
.fstep.g{background:var(--ok-bg);border-color:var(--ok)}
.fstep.r{background:var(--bad-bg);border-color:var(--bad)}
.timer{font-family:var(--f-code);font-size:1.6rem;font-weight:700}
.checkl{list-style:none;padding:0;margin:0;display:grid;gap:6px}
.checkl label{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.checkl input{margin-top:4px}

.pager{display:flex;justify-content:space-between;gap:12px;margin-top:28px;padding-top:16px;border-top:1px solid var(--line)}
.medal{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;max-width:760px}
.medal div{border:1px solid var(--line);border-radius:6px;padding:10px;background:var(--surface-2)}
.medal b{display:block;font-size:1.6rem;font-variant-numeric:tabular-nums}
.medal span{font-size:.8rem;color:var(--muted)}
.toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:#141414;color:#fff;padding:8px 16px;border-radius:6px;font-size:.88rem;z-index:50}

@media (max-width: 1000px){
  .shell{grid-template-columns:1fr;gap:14px;padding-inline:14px}
  .rail{position:static;max-height:none;display:none;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px}
  .rail.open{display:block}
  .menu-btn{display:inline-block}
  .screen{padding:22px 18px 24px}
  .report{grid-template-columns:1fr}

.ver-tag{display:inline-block;font-size:.68rem;font-weight:700;border-radius:3px;padding:0 6px;margin-left:8px;vertical-align:2px;background:var(--upn);color:#000}
.ver-tag.doc{background:var(--concept);color:#fff}
.lbl{font-size:.8rem;color:var(--muted);font-weight:700;display:block;margin-bottom:3px}
.ctlrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px 14px;margin-bottom:12px}
.ctlrow label{display:flex;flex-direction:column;gap:4px;font-size:.84rem;color:var(--ink-2);font-weight:700}
.cascade{display:grid;gap:6px;margin:8px 0}
.casc{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;border:1.5px solid var(--line);border-radius:6px;padding:7px 10px;background:var(--surface);font-size:.9rem}
.casc code{background:transparent;padding:0}
.casc .st{font-size:.76rem;font-weight:700;border-radius:3px;padding:1px 8px;white-space:nowrap}
.casc.pass{border-color:var(--line)}

.casc.hit{border-color:var(--bad);background:var(--bad-bg)}

.casc.skip{opacity:.45}
.casc.skip .st{background:#ECEBE5;color:var(--muted)}
.casc.good{border-color:var(--ok);background:var(--ok-bg)}
.casc.good .st{background:var(--ok);color:#fff}
.casc .no{width:24px;height:24px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:.72rem;font-weight:700}

.rowhit td{background:var(--upn-soft)}
.rowlost td{background:var(--bad-bg)}
.gitflow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;align-items:stretch}
.gstage{border:2px solid var(--line-strong);border-radius:8px;padding:10px;background:var(--surface);text-align:center}

/* ===== Codigo de la guia (generado desde la misma fuente que la guia y los scripts) ===== */
const SRC = {"v_objetos": "USE BDDataSaludTema01;\nGO\n-- Deben aparecer 11 objetos: 5 del Tema 01 y 6 de los Ejercicios 01 y 02 del Tema 02.\nSELECT name, type_desc\nFROM sys.objects\nWHERE name IN ('Paciente', 'EstablecimientoSalud', 'Atencion',\n               'ufn_ClasificarDuracionAtencion', 'usp_RegistrarAtencion',\n               'AuditoriaAtencion', 'trg_Atencion_Auditoria', 'AlertaAtencion',\n               'trg_Atencion_ValidarEstablecimiento', 'trg_Atencion_AlertaDuracion',\n               'trg_Paciente_EvitarEliminacion')\nORDER BY type_desc, name;\n\n-- PAC-001 y PAC-002 activos ('A'); PAC-003 inactivo ('I'). EST-003 inactivo.\nSELECT CodigoPaciente, Estado FROM dbo.Paciente ORDER BY PacienteId;\nSELECT CodigoEstablecimiento, Estado FROM dbo.EstablecimientoSalud ORDER BY EstablecimientoId;\n\n-- Hoy administras la base: debes ser dbo y sysadmin de tu instancia local.\nSELECT USER_NAME() AS UsuarioBD, IS_SRVROLEMEMBER('sysadmin') AS EsSysadmin,\n       SERVERPROPERTY('ProductVersion') AS VersionSQLServer;\nGO", "e1_tablas": "USE BDDataSaludTema01;\nGO\nDROP PROCEDURE IF EXISTS dbo.usp_DispensarVacuna;\nDROP TABLE IF EXISTS dbo.AlertaStock;\nDROP TABLE IF EXISTS dbo.DispensacionVacuna;\nDROP TABLE IF EXISTS dbo.StockVacuna;\nGO\n-- Stock de vacunas por establecimiento (equivale a Medicamentos.Stock de la guia oficial).\nCREATE TABLE dbo.StockVacuna(\n    StockVacunaId INT IDENTITY(1,1)\n        CONSTRAINT PK_StockVacuna PRIMARY KEY,\n    EstablecimientoId INT NOT NULL\n        CONSTRAINT FK_StockVacuna_Establecimiento\n        REFERENCES dbo.EstablecimientoSalud(EstablecimientoId),\n    Vacuna VARCHAR(30) NOT NULL,\n    Stock INT NOT NULL,\n    StockMinimo INT NOT NULL,\n    CONSTRAINT UQ_StockVacuna UNIQUE (EstablecimientoId, Vacuna),\n    CONSTRAINT CK_StockVacuna_Stock CHECK (Stock >= 0)\n);\n-- Cada vacuna aplicada (equivale a VentasFarmacia de la guia oficial).\nCREATE TABLE dbo.DispensacionVacuna(\n    DispensacionId INT IDENTITY(1,1)\n        CONSTRAINT PK_DispensacionVacuna PRIMARY KEY,\n    AtencionId INT NOT NULL\n        CONSTRAINT FK_Dispensacion_Atencion REFERENCES dbo.Atencion(AtencionId),\n    StockVacunaId INT NOT NULL\n        CONSTRAINT FK_Dispensacion_Stock REFERENCES dbo.StockVacuna(StockVacunaId),\n    Dosis INT NOT NULL\n        CONSTRAINT CK_Dispensacion_Dosis CHECK (Dosis > 0),\n    FechaDispensacion DATETIME2 NOT NULL\n        CONSTRAINT DF_Dispensacion_Fecha DEFAULT (SYSDATETIME()),\n    UsuarioBD NVARCHAR(128) NOT NULL\n        CONSTRAINT DF_Dispensacion_Usuario DEFAULT (SUSER_SNAME())\n);\n-- Alerta de stock bajo: es secundaria; si falla, la vacunacion NO debe cancelarse.\nCREATE TABLE dbo.AlertaStock(\n    AlertaStockId INT IDENTITY(1,1)\n        CONSTRAINT PK_AlertaStock PRIMARY KEY,\n    StockVacunaId INT NOT NULL,\n    StockRestante INT NOT NULL,\n    FechaAlerta DATETIME2 NOT NULL\n        CONSTRAINT DF_AlertaStock_Fecha DEFAULT (SYSDATETIME())\n);\nGO\nINSERT INTO dbo.StockVacuna (EstablecimientoId, Vacuna, Stock, StockMinimo)\nVALUES (1, 'INFLUENZA', 5, 3),\n       (1, 'HEPATITIS B', 1, 2),\n       (2, 'INFLUENZA', 10, 3);\nGO\nSELECT StockVacunaId, EstablecimientoId, Vacuna, Stock, StockMinimo\nFROM dbo.StockVacuna ORDER BY StockVacunaId;\nGO", "e1_sp": "CREATE OR ALTER PROCEDURE dbo.usp_DispensarVacuna\n    @PacienteId INT,\n    @EstablecimientoId INT,\n    @Vacuna VARCHAR(30),\n    @Dosis INT = 1,\n    @SimularFalloAlerta BIT = 0\nAS\nBEGIN\n    SET NOCOUNT ON;\n    DECLARE @StockVacunaId INT, @StockMinimo INT, @StockRestante INT,\n            @AtencionId INT, @Clasificacion VARCHAR(20), @Mensaje VARCHAR(300);\n\n    -- 1) Validar ANTES de abrir la transaccion: asi la transaccion dura lo minimo.\n    IF @Dosis IS NULL OR @Dosis <= 0\n    BEGIN\n        ;THROW 56003, 'La cantidad de dosis debe ser mayor que cero.', 1;\n    END;\n\n    SELECT @StockVacunaId = StockVacunaId, @StockMinimo = StockMinimo\n    FROM dbo.StockVacuna\n    WHERE EstablecimientoId = @EstablecimientoId AND Vacuna = @Vacuna;\n\n    IF @StockVacunaId IS NULL\n    BEGIN\n        ;THROW 56002, 'La vacuna no esta registrada en el establecimiento indicado.', 1;\n    END;\n\n    BEGIN TRY\n        BEGIN TRANSACTION;\n\n        -- 2) Descontar el stock SOLO si alcanza.\n        -- TODO 1 (concepto: verificar y descontar en una sola sentencia)\n        UPDATE dbo.StockVacuna\n        SET Stock = Stock - @Dosis\n        WHERE StockVacunaId = @StockVacunaId\n          AND ________;\n\n        IF @@ROWCOUNT = 0\n        BEGIN\n            ;THROW 56001, 'Stock insuficiente: la vacunacion no se registro.', 1;\n        END;\n\n        -- 3) Registrar la atencion con el procedimiento del Tema 01\n        --    (valida paciente y establecimiento).\n        EXEC dbo.usp_RegistrarAtencion\n            @PacienteId = @PacienteId, @EstablecimientoId = @EstablecimientoId,\n            @TipoAtencion = 'VACUNACION', @DuracionMinutos = 10,\n            @AtencionId = @AtencionId OUTPUT, @Clasificacion = @Clasificacion OUTPUT,\n            @Mensaje = @Mensaje OUTPUT;\n\n        -- 4) Registrar la dispensacion.\n        INSERT INTO dbo.DispensacionVacuna (AtencionId, StockVacunaId, Dosis)\n        VALUES (@AtencionId, @StockVacunaId, @Dosis);\n\n        SELECT @StockRestante = Stock FROM dbo.StockVacuna WHERE StockVacunaId = @StockVacunaId;\n\n        -- 5) Alerta de stock bajo protegida con un punto de guardado.\n        SAVE TRANSACTION AntesDeAlerta;\n        BEGIN TRY\n            IF @SimularFalloAlerta = 1\n            BEGIN\n                ;THROW 56004, 'Fallo simulado al registrar la alerta de stock.', 1;\n            END;\n\n            IF @StockRestante < @StockMinimo\n            BEGIN\n                INSERT INTO dbo.AlertaStock (StockVacunaId, StockRestante)\n                VALUES (@StockVacunaId, @StockRestante);\n            END;\n        END TRY\n        BEGIN CATCH\n            IF XACT_STATE() = 1\n            BEGIN\n                -- TODO 2 (concepto: deshacer solo la alerta)\n                ________;\n                PRINT 'No se pudo registrar la alerta; la vacunacion se mantiene.';\n            END\n            ELSE\n            BEGIN\n                ;THROW;\n            END;\n        END CATCH;\n\n        -- TODO 3 (concepto: confirmar todo lo anterior)\n        ________;\n\n        SELECT @AtencionId AS AtencionId, @StockRestante AS StockRestante,\n               'Vacunacion registrada.' AS Resultado;\n    END TRY\n    BEGIN CATCH\n        IF XACT_STATE() <> 0\n        BEGIN\n            ROLLBACK TRANSACTION;\n        END;\n        ;THROW;\n    END CATCH;\nEND;\nGO", "e1_t1": "-- Prueba 1: vacunacion normal (PAC-001 en EST-001, INFLUENZA, 1 dosis).\nEXEC dbo.usp_DispensarVacuna @PacienteId = 1, @EstablecimientoId = 1,\n     @Vacuna = 'INFLUENZA', @Dosis = 1;\n\nSELECT Vacuna, Stock FROM dbo.StockVacuna WHERE EstablecimientoId = 1 ORDER BY Vacuna;\nGO", "e1_t2": "-- Prueba 2: stock insuficiente (HEPATITIS B tiene 1 dosis y se piden 2).\nDECLARE @Antes INT = (SELECT COUNT(*) FROM dbo.Atencion);\nBEGIN TRY\n    EXEC dbo.usp_DispensarVacuna @PacienteId = 1, @EstablecimientoId = 1,\n         @Vacuna = 'HEPATITIS B', @Dosis = 2;\nEND TRY\nBEGIN CATCH\n    SELECT ERROR_NUMBER() AS NumeroError, ERROR_MESSAGE() AS MensajeError,\n           @@TRANCOUNT AS TransaccionesAbiertas;\nEND CATCH;\n\nSELECT Stock AS StockHepatitisB\nFROM dbo.StockVacuna WHERE EstablecimientoId = 1 AND Vacuna = 'HEPATITIS B';\nSELECT COUNT(*) - @Antes AS AtencionesNuevas FROM dbo.Atencion;\nGO", "e1_t3": "-- Prueba 3 (prediccion): PAC-003 esta INACTIVO. El stock se descuenta en el paso 2,\n-- pero la atencion falla en el paso 3. Cuanto stock de INFLUENZA quedara?\nBEGIN TRY\n    EXEC dbo.usp_DispensarVacuna @PacienteId = 3, @EstablecimientoId = 1,\n         @Vacuna = 'INFLUENZA', @Dosis = 1;\nEND TRY\nBEGIN CATCH\n    SELECT ERROR_NUMBER() AS NumeroError, ERROR_MESSAGE() AS MensajeError,\n           @@TRANCOUNT AS TransaccionesAbiertas;\nEND CATCH;\n\nSELECT Stock AS StockInfluenza\nFROM dbo.StockVacuna WHERE EstablecimientoId = 1 AND Vacuna = 'INFLUENZA';\nGO", "e1_t4": "-- Prueba 4a: 2 dosis. El stock baja de 4 a 2 (menor que el minimo 3): se registra una alerta.\nEXEC dbo.usp_DispensarVacuna @PacienteId = 2, @EstablecimientoId = 1,\n     @Vacuna = 'INFLUENZA', @Dosis = 2;\n\n-- Prueba 4b: 1 dosis con fallo simulado en la alerta: la vacunacion se mantiene.\nEXEC dbo.usp_DispensarVacuna @PacienteId = 2, @EstablecimientoId = 1,\n     @Vacuna = 'INFLUENZA', @Dosis = 1, @SimularFalloAlerta = 1;\n\nSELECT Vacuna, Stock FROM dbo.StockVacuna WHERE EstablecimientoId = 1 ORDER BY Vacuna;\nSELECT AlertaStockId, StockVacunaId, StockRestante FROM dbo.AlertaStock ORDER BY AlertaStockId;\nSELECT COUNT(*) AS Dispensaciones FROM dbo.DispensacionVacuna;\nGO", "e2_reinicio": "USE BDDataSaludTema01;\nGO\n-- Reinicio: permite repetir el ejercicio sin errores (no hace falta memorizarlo).\n-- Primero usuarios y roles (nivel base de datos), luego logins (nivel servidor).\nDROP USER IF EXISTS usuario_analista;\nDROP USER IF EXISTS usuario_auditor;\nDROP USER IF EXISTS usuario_administrador;\nDROP ROLE IF EXISTS rol_lectura_general;\nDROP ROLE IF EXISTS rol_analista;\nDROP ROLE IF EXISTS rol_auditor;\nDROP ROLE IF EXISTS rol_administrador;\nGO\nIF SUSER_ID('login_analista') IS NOT NULL\nBEGIN\n    DROP LOGIN login_analista;\nEND;\nIF SUSER_ID('login_auditor') IS NOT NULL\nBEGIN\n    DROP LOGIN login_auditor;\nEND;\nIF SUSER_ID('login_administrador') IS NOT NULL\nBEGIN\n    DROP LOGIN login_administrador;\nEND;\nGO", "e2_logins": "-- Paso 1. Nivel SERVIDOR: un LOGIN por persona, para entrar a la instancia.\nCREATE LOGIN login_analista WITH PASSWORD = 'DataSalud#Analista26', CHECK_POLICY = ON;\nCREATE LOGIN login_auditor WITH PASSWORD = 'DataSalud#Auditor26', CHECK_POLICY = ON;\nCREATE LOGIN login_administrador WITH PASSWORD = 'DataSalud#Admin2026', CHECK_POLICY = ON;\nGO\n-- Nivel BASE DE DATOS: un USER asociado a cada LOGIN.\nCREATE USER usuario_analista FOR LOGIN login_analista;\nCREATE USER usuario_auditor FOR LOGIN login_auditor;\nCREATE USER usuario_administrador FOR LOGIN login_administrador;\nGO\nSELECT name AS LoginServidor, type_desc FROM sys.server_principals\nWHERE name LIKE 'login[_]%' ORDER BY name;\nSELECT name AS UsuarioBase, type_desc FROM sys.database_principals\nWHERE name LIKE 'usuario[_]%' ORDER BY name;\nGO", "e2_roles": "-- Paso 2. Roles: los permisos se dan al ROL, no a cada persona.\n-- TODO 1 (concepto: crear un rol de base de datos)\n________ rol_analista;\nCREATE ROLE rol_auditor;\nCREATE ROLE rol_administrador;\nGO\n-- TODO 2 (concepto: agregar un usuario a un rol existente)\nALTER ROLE rol_analista ________ usuario_analista;\nALTER ROLE rol_auditor ADD MEMBER usuario_auditor;\nALTER ROLE rol_administrador ADD MEMBER usuario_administrador;\nGO", "e2_permisos": "-- Paso 3. Permisos segun la tabla de perfiles (minimo privilegio).\n-- Analista: solo consulta atenciones.\nGRANT SELECT ON dbo.Atencion TO rol_analista;\n\n-- Auditor: consulta atenciones y su trazabilidad; nunca las modifica.\nGRANT SELECT ON dbo.Atencion TO rol_auditor;\n-- TODO 3 (concepto: permiso de lectura sobre la auditoria)\nGRANT ________ ON dbo.AuditoriaAtencion TO rol_auditor;\n-- TODO 4 (concepto: negar de forma explicita)\n________ INSERT, UPDATE, DELETE ON dbo.Atencion TO rol_auditor;\n\n-- Administrador: mantiene atenciones, lee la auditoria y dispensa vacunas.\n-- TODO 5 (concepto: los cuatro permisos de mantenimiento)\nGRANT ________ ON dbo.Atencion TO rol_administrador;\nGRANT SELECT ON dbo.AuditoriaAtencion TO rol_administrador;\nGRANT SELECT ON dbo.StockVacuna TO rol_administrador;\nGRANT EXECUTE ON dbo.usp_DispensarVacuna TO rol_administrador;\nGO", "e2_pruebas": "-- Paso 4. Pruebas: EXECUTE AS LOGIN suplanta a la persona sin cerrar tu sesion.\nEXECUTE AS LOGIN = 'login_analista';\nSELECT SUSER_SNAME() AS LoginActual, USER_NAME() AS UsuarioActual;\nSELECT TOP (3) AtencionId, TipoAtencion, DuracionMinutos FROM dbo.Atencion ORDER BY AtencionId;\nBEGIN TRY\n    DELETE FROM dbo.Atencion WHERE AtencionId = -1;   -- -1 no existe: no se borra nada real\nEND TRY\nBEGIN CATCH\n    SELECT 'analista: DELETE' AS Prueba, ERROR_NUMBER() AS NumeroError,\n           ERROR_MESSAGE() AS MensajeError;\nEND CATCH;\nREVERT;\nGO\nEXECUTE AS LOGIN = 'login_auditor';\nSELECT COUNT(*) AS FilasAuditoriaVisibles FROM dbo.AuditoriaAtencion;\nBEGIN TRY\n    UPDATE dbo.Atencion SET DuracionMinutos = 99 WHERE AtencionId = -1;\nEND TRY\nBEGIN CATCH\n    SELECT 'auditor: UPDATE' AS Prueba, ERROR_NUMBER() AS NumeroError,\n           ERROR_MESSAGE() AS MensajeError;\nEND CATCH;\nREVERT;\nGO\nSELECT SUSER_SNAME() AS DebeSerTuLogin;   -- confirma que REVERT te devolvio tu identidad\nGO", "e2_deny": "-- Paso 5. Un rol demasiado amplio: SELECT sobre TODO el esquema dbo.\nCREATE ROLE rol_lectura_general;\nGRANT SELECT ON SCHEMA::dbo TO rol_lectura_general;\nALTER ROLE rol_lectura_general ADD MEMBER usuario_analista;\nGO\n-- Prediccion: el analista puede leer ahora la auditoria?\nEXECUTE AS LOGIN = 'login_analista';\nSELECT COUNT(*) AS AuditoriaLeidaPorAnalista FROM dbo.AuditoriaAtencion;\nREVERT;\nGO\n-- La politica dice que el analista NO accede a la auditoria. DENY gana sobre cualquier GRANT.\nDENY SELECT ON dbo.AuditoriaAtencion TO rol_analista;\nGO\nEXECUTE AS LOGIN = 'login_analista';\nBEGIN TRY\n    SELECT COUNT(*) AS AuditoriaLeidaPorAnalista FROM dbo.AuditoriaAtencion;\nEND TRY\nBEGIN CATCH\n    SELECT 'con DENY' AS Prueba, ERROR_NUMBER() AS NumeroError, ERROR_MESSAGE() AS MensajeError;\nEND CATCH;\nREVERT;\nGO\n-- REVOKE retira el DENY, pero no otorga nada: el analista vuelve a leer por el rol amplio.\nREVOKE SELECT ON dbo.AuditoriaAtencion FROM rol_analista;\nGO\nEXECUTE AS LOGIN = 'login_analista';\nSELECT COUNT(*) AS AuditoriaLeidaPorAnalista FROM dbo.AuditoriaAtencion;\nREVERT;\nGO\n-- Cierre con minimo privilegio: se elimina el rol amplio y la politica queda escrita con DENY.\nALTER ROLE rol_lectura_general DROP MEMBER usuario_analista;\nDROP ROLE rol_lectura_general;\nDENY SELECT ON dbo.AuditoriaAtencion TO rol_analista;\nGO", "e2_puerta": "-- Paso 6. El procedimiento como unica puerta al stock.\n-- El administrador tiene EXECUTE sobre usp_DispensarVacuna, pero NO tiene UPDATE sobre StockVacuna.\nEXECUTE AS LOGIN = 'login_administrador';\nBEGIN TRY\n    UPDATE dbo.StockVacuna SET Stock = Stock + 100 WHERE EstablecimientoId = 2;\nEND TRY\nBEGIN CATCH\n    SELECT 'UPDATE directo' AS Intento, ERROR_NUMBER() AS NumeroError,\n           ERROR_MESSAGE() AS MensajeError;\nEND CATCH;\nEXEC dbo.usp_DispensarVacuna @PacienteId = 2, @EstablecimientoId = 2,\n     @Vacuna = 'INFLUENZA', @Dosis = 1;\nREVERT;\nGO\n-- Quien hizo la dispensacion? (la auditoria del Tema 02 tambien lo registra)\nSELECT TOP (1) DispensacionId, Dosis, UsuarioBD\nFROM dbo.DispensacionVacuna ORDER BY DispensacionId DESC;\nSELECT TOP (1) AuditoriaId, Operacion, UsuarioBD\nFROM dbo.AuditoriaAtencion ORDER BY AuditoriaId DESC;\nGO", "e2_ver": "-- Evidencia: permisos otorgados (GRANT) y negados (DENY) por rol.\nSELECT pr.name AS Rol, pe.state_desc AS Estado, pe.permission_name AS Permiso,\n       OBJECT_NAME(pe.major_id) AS Objeto, COL_NAME(pe.major_id, pe.minor_id) AS Columna\nFROM sys.database_permissions AS pe\nINNER JOIN sys.database_principals AS pr\n    ON pr.principal_id = pe.grantee_principal_id\nWHERE pr.name LIKE 'rol[_]%'\nORDER BY Rol, Objeto, Permiso;\nGO", "e3_tablas": "USE BDDataSaludTema01;\nGO\nDROP PROCEDURE IF EXISTS dbo.usp_ConsultarDetalleClinico;\nDROP TABLE IF EXISTS dbo.LogAccesoPaciente;\nDROP TABLE IF EXISTS dbo.DetalleClinicoRestringido;\nGO\n-- Detalle clinico: la columna Diagnostico es un dato sensible (Ley 29733).\nCREATE TABLE dbo.DetalleClinicoRestringido(\n    DetalleClinicoId INT IDENTITY(1,1)\n        CONSTRAINT PK_DetalleClinicoRestringido PRIMARY KEY,\n    PacienteId INT NOT NULL\n        CONSTRAINT FK_DetalleClinico_Paciente REFERENCES dbo.Paciente(PacienteId),\n    NivelRiesgo VARCHAR(10) NOT NULL\n        CONSTRAINT CK_DetalleClinico_Riesgo CHECK (NivelRiesgo IN ('BAJO','MEDIO','ALTO')),\n    Diagnostico VARCHAR(100) NOT NULL,\n    FechaRegistro DATE NOT NULL\n        CONSTRAINT DF_DetalleClinico_Fecha DEFAULT (CAST(SYSDATETIME() AS DATE))\n);\n-- Registro de accesos (equivale a Log_Accesos de la guia oficial).\nCREATE TABLE dbo.LogAccesoPaciente(\n    LogId BIGINT IDENTITY(1,1)\n        CONSTRAINT PK_LogAccesoPaciente PRIMARY KEY,\n    Usuario NVARCHAR(128) NOT NULL,\n    FechaAcceso DATETIME2 NOT NULL\n        CONSTRAINT DF_LogAcceso_Fecha DEFAULT (SYSDATETIME()),\n    AccionRealizada VARCHAR(60) NOT NULL,\n    PacienteId INT NULL\n);\nGO\nINSERT INTO dbo.DetalleClinicoRestringido (PacienteId, NivelRiesgo, Diagnostico)\nVALUES (1, 'BAJO', 'Control preventivo (dato sintetico)'),\n       (2, 'MEDIO', 'Seguimiento de vacunacion (dato sintetico)'),\n       (3, 'ALTO', 'Evaluacion pendiente (dato sintetico)');\nGO", "e3_sol": "-- R1. Analista: ve el detalle clinico, pero nunca la columna Diagnostico.\n-- (escribe aqui tu codigo)\nGO\n-- R2. Auditor: no accede al detalle clinico.\n-- (escribe aqui tu codigo)\nGO\n-- R3. Procedimiento de consulta que registra cada acceso.\nCREATE OR ALTER PROCEDURE dbo.usp_ConsultarDetalleClinico\n    @CodigoPaciente VARCHAR(20)\nAS\nBEGIN\n    SET NOCOUNT ON;\n    DECLARE @PacienteId INT;\n    -- 1) Buscar el PacienteId a partir del codigo.\n    -- 2) Si no existe, lanzar el error 57001.\n    -- 3) Registrar el acceso en dbo.LogAccesoPaciente (quien, que accion, que paciente).\n    -- 4) Devolver el detalle clinico del paciente.\n    -- (escribe aqui tu codigo)\nEND;\nGO\n-- R4. Administrador: consulta el detalle SOLO mediante el procedimiento.\n-- (escribe aqui tu codigo)\nGO", "e3_t": "-- Casos de prueba (no cambies este bloque; compara con el resultado esperado de la guia).\n-- Caso 1. Analista: columnas permitidas.\nEXECUTE AS LOGIN = 'login_analista';\nSELECT PacienteId, NivelRiesgo, FechaRegistro FROM dbo.DetalleClinicoRestringido;\n-- Caso 2. Analista: la columna Diagnostico.\nBEGIN TRY\n    SELECT PacienteId, Diagnostico FROM dbo.DetalleClinicoRestringido;\nEND TRY\nBEGIN CATCH\n    SELECT 'Caso 2' AS Caso, ERROR_NUMBER() AS NumeroError, ERROR_MESSAGE() AS MensajeError;\nEND CATCH;\nREVERT;\nGO\n-- Caso 3. Auditor: cualquier lectura del detalle.\nEXECUTE AS LOGIN = 'login_auditor';\nBEGIN TRY\n    SELECT TOP (1) PacienteId FROM dbo.DetalleClinicoRestringido;\nEND TRY\nBEGIN CATCH\n    SELECT 'Caso 3' AS Caso, ERROR_NUMBER() AS NumeroError, ERROR_MESSAGE() AS MensajeError;\nEND CATCH;\nREVERT;\nGO\n-- Caso 4. Administrador: lectura directa (debe fallar) y por el procedimiento (debe funcionar).\nEXECUTE AS LOGIN = 'login_administrador';\nBEGIN TRY\n    SELECT * FROM dbo.DetalleClinicoRestringido;\nEND TRY\nBEGIN CATCH\n    SELECT 'Caso 4' AS Caso, ERROR_NUMBER() AS NumeroError, ERROR_MESSAGE() AS MensajeError;\nEND CATCH;\nEXEC dbo.usp_ConsultarDetalleClinico @CodigoPaciente = 'PAC-002';\n-- Caso 5. Paciente inexistente.\nBEGIN TRY\n    EXEC dbo.usp_ConsultarDetalleClinico @CodigoPaciente = 'PAC-999';\nEND TRY\nBEGIN CATCH\n    SELECT 'Caso 5' AS Caso, ERROR_NUMBER() AS NumeroError, ERROR_MESSAGE() AS MensajeError;\nEND CATCH;\nREVERT;\nGO\n-- Caso 6. El registro de accesos.\nSELECT LogId, Usuario, AccionRealizada, PacienteId FROM dbo.LogAccesoPaciente ORDER BY LogId;\nGO", "e4_escenario": "USE BDDataSaludTema01;\nGO\nDROP TABLE IF EXISTS dbo.AtencionRendimientoTema03;\nGO\nCREATE TABLE dbo.AtencionRendimientoTema03(\n    AtencionRendimientoId INT IDENTITY(1,1)\n        CONSTRAINT PK_AtencionRendimientoTema03 PRIMARY KEY,\n    EstablecimientoId INT NOT NULL,\n    FechaAtencion DATETIME2 NOT NULL,\n    TipoAtencion VARCHAR(30) NOT NULL,\n    DuracionMinutos INT NOT NULL\n);\nGO\n-- 50 000 atenciones sinteticas (no hace falta memorizar este bloque).\nWITH Numeros AS\n(\n    SELECT TOP (50000) ROW_NUMBER() OVER (ORDER BY (SELECT NULL)) AS Numero\n    FROM sys.all_objects AS A\n    CROSS JOIN sys.all_objects AS B\n)\nINSERT INTO dbo.AtencionRendimientoTema03\n    (EstablecimientoId, FechaAtencion, TipoAtencion, DuracionMinutos)\nSELECT ((Numero * 17) % 50) + 1,\n       DATEADD(MINUTE, Numero % 1440,\n               DATEADD(DAY, Numero % 365, CAST('2025-09-01' AS DATETIME2))),\n       CASE Numero % 3 WHEN 0 THEN 'CONSULTA' WHEN 1 THEN 'CONTROL' ELSE 'VACUNACION' END,\n       ((Numero * 7) % 50) + 10\nFROM Numeros;\nGO\nSELECT COUNT(*) AS TotalAtenciones FROM dbo.AtencionRendimientoTema03;\nEXEC sp_helpindex 'dbo.AtencionRendimientoTema03';\nGO", "e4_consultas": "-- Antes de ejecutar: activa Include Actual Execution Plan (Ctrl + M).\nSET STATISTICS IO ON;\nSET STATISTICS TIME ON;\nGO\n-- Consulta A: reporte de un establecimiento en un mes.\nSELECT AtencionRendimientoId, EstablecimientoId, FechaAtencion\nFROM dbo.AtencionRendimientoTema03\nWHERE EstablecimientoId = 17\n  AND FechaAtencion >= '2026-07-01'\n  AND FechaAtencion < '2026-08-01';\nGO\n-- Consulta B: el mismo filtro (primera quincena) con dos columnas mas en el SELECT.\nSELECT AtencionRendimientoId, FechaAtencion, TipoAtencion, DuracionMinutos\nFROM dbo.AtencionRendimientoTema03\nWHERE EstablecimientoId = 17\n  AND FechaAtencion >= '2026-07-01'\n  AND FechaAtencion < '2026-07-16';\nGO", "e4_sol": "-- Decision 1: indice para la consulta A (igualdad primero, rango despues).\n-- (escribe aqui tu codigo)\nGO\n-- Vuelve a ejecutar la consulta A y luego la B. Observa el plan de la B.\n-- Decision 2: la consulta B muestra Key Lookup. Ajusta el indice para cubrirla.\n-- (escribe aqui tu codigo)\nGO\n-- Cierre del ejercicio.\nSET STATISTICS IO OFF;\nSET STATISTICS TIME OFF;\nGO\nSELECT name AS Indice, type_desc AS Tipo\nFROM sys.indexes\nWHERE object_id = OBJECT_ID('dbo.AtencionRendimientoTema03')\nORDER BY index_id;\nGO", "e5_ruta": "USE BDDataSaludTema01;\nGO\n-- Paso 1. Donde se guardaran los respaldos.\nCREATE OR ALTER FUNCTION dbo.ufn_RutaRespaldo()\nRETURNS NVARCHAR(260)\nAS\nBEGIN\n    DECLARE @Ruta NVARCHAR(260) = CONVERT(NVARCHAR(260),\n        COALESCE(SERVERPROPERTY('InstanceDefaultBackupPath'),\n                 SERVERPROPERTY('InstanceDefaultDataPath')));\n    IF RIGHT(@Ruta, 1) NOT IN ('\\', '/')\n    BEGIN\n        SET @Ruta = @Ruta + N'\\';\n    END;\n    RETURN @Ruta;\nEND;\nGO\nSELECT dbo.ufn_RutaRespaldo() AS RutaRespaldo,\n       SERVERPROPERTY('InstanceDefaultDataPath') AS RutaDatos;\nGO\n-- Tabla de evidencia: cada fila marca un momento de la secuencia.\nDROP TABLE IF EXISTS dbo.EvidenciaBackupTema03;\nCREATE TABLE dbo.EvidenciaBackupTema03(\n    EvidenciaId INT IDENTITY(1,1)\n        CONSTRAINT PK_EvidenciaBackupTema03 PRIMARY KEY,\n    Descripcion VARCHAR(100) NOT NULL,\n    FechaRegistro DATETIME2 NOT NULL\n        CONSTRAINT DF_EvidenciaBackup_Fecha DEFAULT (SYSDATETIME())\n);\nINSERT INTO dbo.EvidenciaBackupTema03 (Descripcion) VALUES ('1. Antes del FULL');\nGO", "e5_full": "-- Paso 2. Respaldo COMPLETO (FULL): copia toda la base.\nDECLARE @ArchivoFull NVARCHAR(400) = dbo.ufn_RutaRespaldo() + N'BDDataSaludTema03_FULL.bak';\nBACKUP DATABASE BDDataSaludTema01\nTO DISK = @ArchivoFull\nWITH INIT, CHECKSUM, NAME = N'DataSalud Tema 03 - FULL', STATS = 25;\nSELECT @ArchivoFull AS ArchivoGenerado;\nGO\n-- Un cambio DESPUES del FULL.\nINSERT INTO dbo.EvidenciaBackupTema03 (Descripcion) VALUES ('2. Despues del FULL');\nGO", "e5_diff": "-- Paso 3. Respaldo DIFERENCIAL: solo lo que cambio desde el ultimo FULL.\nDECLARE @ArchivoDiff NVARCHAR(400) = dbo.ufn_RutaRespaldo() + N'BDDataSaludTema03_DIFF.bak';\nBACKUP DATABASE BDDataSaludTema01\nTO DISK = @ArchivoDiff\nWITH DIFFERENTIAL, INIT, CHECKSUM, NAME = N'DataSalud Tema 03 - DIFF', STATS = 25;\nSELECT @ArchivoDiff AS ArchivoGenerado;\nGO\n-- Un cambio DESPUES del DIFF (ningun respaldo lo contiene todavia).\nINSERT INTO dbo.EvidenciaBackupTema03 (Descripcion) VALUES ('3. Despues del DIFF');\nGO", "e5_verificar": "-- Paso 4. Verificar los archivos e historial.\nDECLARE @ArchivoFull NVARCHAR(400) = dbo.ufn_RutaRespaldo() + N'BDDataSaludTema03_FULL.bak';\nDECLARE @ArchivoDiff NVARCHAR(400) = dbo.ufn_RutaRespaldo() + N'BDDataSaludTema03_DIFF.bak';\nRESTORE VERIFYONLY FROM DISK = @ArchivoFull WITH CHECKSUM;\nRESTORE VERIFYONLY FROM DISK = @ArchivoDiff WITH CHECKSUM;\n-- Que contiene el FULL (nombres logicos de los archivos de datos y de log).\nRESTORE FILELISTONLY FROM DISK = @ArchivoFull;\nGO\nSELECT TOP (4) bs.name AS Respaldo,\n       CASE bs.type WHEN 'D' THEN 'FULL' WHEN 'I' THEN 'DIFFERENTIAL'\n                    WHEN 'L' THEN 'LOG' END AS Tipo,\n       bs.backup_finish_date AS Fin, mf.physical_device_name AS Archivo\nFROM msdb.dbo.backupset AS bs\nINNER JOIN msdb.dbo.backupmediafamily AS mf\n    ON mf.media_set_id = bs.media_set_id\nWHERE bs.database_name = 'BDDataSaludTema01'\nORDER BY bs.backup_finish_date DESC;\nGO", "e5_restore": "-- Paso 5. Restauracion REAL en una base de prueba (la base original no se toca).\nUSE master;\nGO\nIF DB_ID('BDDataSaludTema03_Restore') IS NOT NULL\nBEGIN\n    IF DATABASEPROPERTYEX('BDDataSaludTema03_Restore', 'Status') = 'ONLINE'\n    BEGIN\n        ALTER DATABASE BDDataSaludTema03_Restore SET SINGLE_USER WITH ROLLBACK IMMEDIATE;\n    END;\n    DROP DATABASE BDDataSaludTema03_Restore;\nEND;\nGO\nDECLARE @Ruta NVARCHAR(260) = BDDataSaludTema01.dbo.ufn_RutaRespaldo();\nDECLARE @ArchivoFull NVARCHAR(400) = @Ruta + N'BDDataSaludTema03_FULL.bak';\nDECLARE @ArchivoDiff NVARCHAR(400) = @Ruta + N'BDDataSaludTema03_DIFF.bak';\nDECLARE @RutaDatos NVARCHAR(260) =\n    CONVERT(NVARCHAR(260), SERVERPROPERTY('InstanceDefaultDataPath'));\nIF RIGHT(@RutaDatos, 1) NOT IN ('\\', '/')\nBEGIN\n    SET @RutaDatos = @RutaDatos + N'\\';\nEND;\nDECLARE @Mdf NVARCHAR(400) = @RutaDatos + N'BDDataSaludTema03_Restore.mdf';\nDECLARE @Ldf NVARCHAR(400) = @RutaDatos + N'BDDataSaludTema03_Restore_log.ldf';\nDECLARE @LogicoDatos SYSNAME, @LogicoLog SYSNAME;\nSELECT @LogicoDatos = name FROM BDDataSaludTema01.sys.database_files WHERE type_desc = 'ROWS';\nSELECT @LogicoLog = name FROM BDDataSaludTema01.sys.database_files WHERE type_desc = 'LOG';\n\n-- 5a) FULL con NORECOVERY: la base queda \"Restaurando...\", esperando el diferencial.\nRESTORE DATABASE BDDataSaludTema03_Restore\nFROM DISK = @ArchivoFull\nWITH MOVE @LogicoDatos TO @Mdf,\n     MOVE @LogicoLog TO @Ldf,\n     NORECOVERY, STATS = 25;\n\n-- 5b) DIFF con RECOVERY: termina la secuencia y deja la base disponible.\nRESTORE DATABASE BDDataSaludTema03_Restore\nFROM DISK = @ArchivoDiff\nWITH RECOVERY, STATS = 25;\nGO\n-- Comparacion: la base original tiene 3 filas; la restaurada, las que alcanzaron a respaldarse.\nSELECT 'Original' AS Base, EvidenciaId, Descripcion\nFROM BDDataSaludTema01.dbo.EvidenciaBackupTema03\nUNION ALL\nSELECT 'Restaurada', EvidenciaId, Descripcion\nFROM BDDataSaludTema03_Restore.dbo.EvidenciaBackupTema03\nORDER BY Base, EvidenciaId;\nGO", "e5_programado": "-- Paso 6. Respaldo programado: FULL los domingos y DIFERENCIAL el resto de dias.\nUSE BDDataSaludTema01;\nGO\nCREATE OR ALTER PROCEDURE dbo.usp_RespaldoProgramado\n    @TipoForzado VARCHAR(4) = NULL      -- 'FULL', 'DIFF' o NULL (decide segun el dia)\nAS\nBEGIN\n    SET NOCOUNT ON;\n    DECLARE @Tipo VARCHAR(4) = @TipoForzado, @Archivo NVARCHAR(400);\n\n    IF @Tipo IS NULL\n    BEGIN\n        SET @Tipo = CASE WHEN DATEDIFF(DAY, '19000107', SYSDATETIME()) % 7 = 0\n                         THEN 'FULL' ELSE 'DIFF' END;\n    END;\n\n    IF @Tipo NOT IN ('FULL', 'DIFF')\n    BEGIN\n        ;THROW 58001, 'Tipo de respaldo no valido. Use FULL o DIFF.', 1;\n    END;\n\n    SET @Archivo = dbo.ufn_RutaRespaldo() + N'BDDataSalud_' + @Tipo + N'_'\n                 + CONVERT(NCHAR(8), SYSDATETIME(), 112) + N'.bak';\n\n    IF @Tipo = 'FULL'\n    BEGIN\n        BACKUP DATABASE BDDataSaludTema01 TO DISK = @Archivo WITH INIT, CHECKSUM;\n    END\n    ELSE\n    BEGIN\n        BACKUP DATABASE BDDataSaludTema01 TO DISK = @Archivo WITH DIFFERENTIAL, INIT, CHECKSUM;\n    END;\n\n    SELECT @Tipo AS TipoRespaldo, @Archivo AS Archivo;\nEND;\nGO\nEXEC dbo.usp_RespaldoProgramado;                        -- decide segun el dia de hoy\nEXEC dbo.usp_RespaldoProgramado @TipoForzado = 'FULL';\nBEGIN TRY\n    EXEC dbo.usp_RespaldoProgramado @TipoForzado = 'LOG';\nEND TRY\nBEGIN CATCH\n    SELECT ERROR_NUMBER() AS NumeroError, ERROR_MESSAGE() AS MensajeError;\nEND CATCH;\nGO", "p_escenario": "USE BDDataSaludTema01;\nGO\n-- Escenario: una tabla con clave GUID aleatoria se fragmenta con cada INSERT.\nDROP PROCEDURE IF EXISTS dbo.usp_MantenerIndices;\nDROP PROCEDURE IF EXISTS dbo.usp_DepurarLogAccesos;\nDROP TABLE IF EXISTS dbo.LogMantenimientoIndice;\nDROP TABLE IF EXISTS dbo.SolicitudExamenTema03;\nGO\nCREATE TABLE dbo.SolicitudExamenTema03(\n    SolicitudId UNIQUEIDENTIFIER NOT NULL\n        CONSTRAINT DF_SolicitudExamen_Id DEFAULT (NEWID())\n        CONSTRAINT PK_SolicitudExamenTema03 PRIMARY KEY,\n    Detalle CHAR(200) NOT NULL\n        CONSTRAINT DF_SolicitudExamen_Detalle DEFAULT ('Solicitud sintetica')\n);\nCREATE TABLE dbo.LogMantenimientoIndice(\n    LogMantenimientoId INT IDENTITY(1,1)\n        CONSTRAINT PK_LogMantenimientoIndice PRIMARY KEY,\n    Tabla SYSNAME NOT NULL,\n    Indice SYSNAME NOT NULL,\n    FragmentacionAntes DECIMAL(5,2) NOT NULL,\n    Accion VARCHAR(12) NOT NULL,\n    FechaMantenimiento DATETIME2 NOT NULL\n        CONSTRAINT DF_LogMantenimiento_Fecha DEFAULT (SYSDATETIME())\n);\nGO\n-- 100 lotes de 200 filas: cada lote cae en cualquier parte del indice y divide paginas.\nSET NOCOUNT ON;\nDECLARE @Lote INT = 0;\nWHILE @Lote < 100\nBEGIN\n    INSERT INTO dbo.SolicitudExamenTema03 (Detalle)\n    SELECT TOP (200) 'Solicitud sintetica' FROM sys.all_objects;\n    SET @Lote = @Lote + 1;\nEND;\nSET NOCOUNT OFF;\nGO\n-- Registros de acceso antiguos (sinteticos) para la depuracion.\nINSERT INTO dbo.LogAccesoPaciente (Usuario, FechaAcceso, AccionRealizada, PacienteId)\nVALUES ('usuario_sintetico', DATEADD(MONTH, -14, SYSDATETIME()), 'CONSULTA DETALLE CLINICO', 1),\n       ('usuario_sintetico', DATEADD(MONTH, -13, SYSDATETIME()), 'CONSULTA DETALLE CLINICO', 2),\n       ('usuario_sintetico', DATEADD(MONTH, -2, SYSDATETIME()), 'CONSULTA DETALLE CLINICO', 2);\nGO", "p_frag": "-- Diagnostico: fragmentacion de los indices con al menos 100 paginas.\nSELECT OBJECT_NAME(ps.object_id) AS Tabla, i.name AS Indice,\n       CAST(ps.avg_fragmentation_in_percent AS DECIMAL(5,2)) AS Fragmentacion,\n       ps.page_count AS Paginas\nFROM sys.dm_db_index_physical_stats(DB_ID(), NULL, NULL, NULL, 'LIMITED') AS ps\nINNER JOIN sys.indexes AS i\n    ON i.object_id = ps.object_id AND i.index_id = ps.index_id\nWHERE ps.index_id > 0 AND ps.page_count >= 100\nORDER BY Fragmentacion DESC;\nGO", "p_sol": "-- P1. Mantenimiento de indices: REBUILD si supera el umbral; REORGANIZE entre 5 % y el umbral.\nCREATE OR ALTER PROCEDURE dbo.usp_MantenerIndices\n    @Umbral DECIMAL(5,2) = 30\nAS\nBEGIN\n    SET NOCOUNT ON;\n    DECLARE @Esquema SYSNAME, @Tabla SYSNAME, @Indice SYSNAME,\n            @Frag DECIMAL(5,2), @Accion VARCHAR(12), @Sql NVARCHAR(600);\n\n    -- (escribe aqui tu codigo)\nEND;\nGO\n-- P2. Depuracion de registros de acceso con mas de @MesesRetencion meses.\nCREATE OR ALTER PROCEDURE dbo.usp_DepurarLogAccesos\n    @MesesRetencion INT = 12\nAS\nBEGIN\n    SET NOCOUNT ON;\n    DECLARE @Limite DATETIME2, @Total INT = 0, @Filas INT = 1;\n    -- (escribe aqui tu codigo)\nEND;\nGO", "p_t": "-- Pruebas del propuesto.\nEXEC dbo.usp_MantenerIndices @Umbral = 30;\nSELECT Tabla, Indice, FragmentacionAntes, Accion FROM dbo.LogMantenimientoIndice;\n-- Vuelve a ejecutar el diagnostico: la fragmentacion de SolicitudExamenTema03 debe bajar.\n\nEXEC dbo.usp_DepurarLogAccesos @MesesRetencion = 12;   -- elimina 2 registros antiguos\nSELECT COUNT(*) AS RegistrosDeHaceMasDeUnAnio\nFROM dbo.LogAccesoPaciente WHERE FechaAcceso < DATEADD(MONTH, -12, SYSDATETIME());\nGO", "r_supervisor": "USE BDDataSaludTema01;\nGO\n-- Reinicio del reto.\nDROP USER IF EXISTS usuario_supervisor_calidad;\nDROP ROLE IF EXISTS rol_supervisor_calidad;\nGO\nIF SUSER_ID('login_supervisor_calidad') IS NOT NULL\nBEGIN\n    DROP LOGIN login_supervisor_calidad;\nEND;\nGO\n-- Parte A. Perfil Supervisor de Calidad (sin tecnicas nuevas).\n-- (escribe aqui tu codigo)\nGO\n-- Parte B. Indice para la consulta de seguimiento del supervisor.\nDROP INDEX IF EXISTS IX_AtencionRend_Tipo_Fecha ON dbo.AtencionRendimientoTema03;\n-- (escribe aqui tu codigo)\nGO", "r_conexion": "-- Parte C. Control de conexion por IP (requerimiento 10, simulado con un procedimiento).\nDROP PROCEDURE IF EXISTS dbo.usp_ValidarConexion;\nDROP TABLE IF EXISTS dbo.LogConexion;\nDROP TABLE IF EXISTS dbo.ConexionPermitida;\nGO\nCREATE TABLE dbo.ConexionPermitida(\n    LoginNombre SYSNAME NOT NULL,\n    DireccionIp VARCHAR(48) NOT NULL,\n    CONSTRAINT PK_ConexionPermitida PRIMARY KEY (LoginNombre, DireccionIp)\n);\nCREATE TABLE dbo.LogConexion(\n    LogConexionId INT IDENTITY(1,1)\n        CONSTRAINT PK_LogConexion PRIMARY KEY,\n    LoginNombre SYSNAME NOT NULL,\n    DireccionIp VARCHAR(48) NULL,\n    Resultado VARCHAR(10) NOT NULL,\n    FechaIntento DATETIME2 NOT NULL\n        CONSTRAINT DF_LogConexion_Fecha DEFAULT (SYSDATETIME())\n);\nGO\n-- La conexion local de SSMS se identifica como '<local machine>'.\nINSERT INTO dbo.ConexionPermitida (LoginNombre, DireccionIp)\nVALUES (SUSER_SNAME(), '<local machine>'),\n       ('login_analista', '10.20.30.40');\nGO\nCREATE OR ALTER PROCEDURE dbo.usp_ValidarConexion\nAS\nBEGIN\n    SET NOCOUNT ON;\n    -- (escribe aqui tu codigo)\nEND;\nGO\nGRANT EXECUTE ON dbo.usp_ValidarConexion TO rol_analista;\nGO\nEXEC dbo.usp_ValidarConexion;                 -- tu login, conexion local: PERMITIDA\nEXECUTE AS LOGIN = 'login_analista';\nBEGIN TRY\n    EXEC dbo.usp_ValidarConexion;             -- solo permitido desde 10.20.30.40: RECHAZADA\nEND TRY\nBEGIN CATCH\n    SELECT ERROR_NUMBER() AS NumeroError, ERROR_MESSAGE() AS MensajeError;\nEND CATCH;\nREVERT;\nGO\nSELECT LoginNombre, DireccionIp, Resultado FROM dbo.LogConexion ORDER BY LogConexionId;\nGO"};


/* ===== 1. SIMULACIONES (todo se calcula en JavaScript; nunca se ejecuta SQL Server) ===== */
const SIMS = {};
const SS = n => S.sim[n] || (S.sim[n] = SIMS[n].init());
function renderSim(el) { const n = el.dataset.sim, s = SS(n); el.innerHTML = SIMS[n].ctl(s) + `<div class="so" aria-live="polite">${SIMS[n].out(s)}</div>`; }
function refreshSim(n) { $$(`.simbox[data-sim="${n}"]`).forEach(el => { const so = $(".so", el); if (so) so.innerHTML = SIMS[n].out(SS(n)); }); }
function fullSim(n) { $$(`.simbox[data-sim="${n}"]`).forEach(renderSim); }
const optsHTML = (list, cur) => list.map(o => `<option${String(o) === String(cur) ? " selected" : ""}>${esc(o)}</option>`).join("");
const sel = (sim, key, label, list, cur) => `<label>${label}<select data-si="${sim}:${key}">${optsHTML(list, cur)}</select></label>`;
const chk = (sim, key, label, cur) => `<label class="chip" style="display:inline-flex;gap:6px;align-items:center"><input type="checkbox" data-si="${sim}:${key}" ${cur ? "checked" : ""}> ${label}</label>`;
const bt = (sim, a, label, cls = "") => `<button class="btn ${cls}" type="button" data-sa="${sim}:${a}">${label}</button>`;
const cas = (n, txt, cls, st) => `<div class="casc ${cls}"><span class="no">${n}</span><span><code>${esc(txt)}</code></span><span class="st">${st}</span></div>`;
const ER = (num, msg) => `<div class="er"><b>Msg ${num}</b> · ${esc(msg)}</div>`;
const GOOD = t => `<div class="er good">${t}</div>`;
const TC = n => `<span class="pill ${n ? "time" : "dark"}">@@TRANCOUNT = ${n}</span>`;
const nv = v => v === null || v === undefined ? NULLC : esc(v);

/* ---------- 1.1 Dispensación con transacción (Ejercicio 01, puente) ---------- */
const STK0 = () => ({ INFLUENZA: 5, "HEPATITIS B": 1 });
const MIN = { INFLUENZA: 3, "HEPATITIS B": 2 };
SIMS.stock = {
  init: () => ({ st: STK0(), al: [], dis: 0, p: "PAC-001 (activo)", v: "INFLUENZA", d: "1", f: false, last: null }),
  ctl: s => `<div class="ctlrow">${sel("stock", "p", "@PacienteId", ["PAC-001 (activo)", "PAC-002 (activo)", "PAC-003 (inactivo)"], s.p)}${sel("stock", "v", "@Vacuna (EST-001)", ["INFLUENZA", "HEPATITIS B"], s.v)}${sel("stock", "d", "@Dosis", ["1", "2"], s.d)}</div><div class="toolbar">${chk("stock", "f", "@SimularFalloAlerta = 1", s.f)}${bt("stock", "run", "EXEC dbo.usp_DispensarVacuna", "pri")}${bt("stock", "reset", "Reiniciar stock", "ghost")}</div>`,
  act(s, a) {
    if (a === "reset") { Object.assign(s, SIMS.stock.init()); return; }
    const st = [], P = (t, r, c) => st.push([t, r, c]), d = +s.d, v = s.v, inact = s.p.includes("inactivo");
    s.last = { st, res: "" };
    P("Validar @Dosis y la vacuna (antes de la transacción)", "correcto", "pass");
    P("BEGIN TRANSACTION", "@@TRANCOUNT = 1", "good");
    if (s.st[v] < d) {
      P(`UPDATE StockVacuna ... WHERE ... AND Stock >= ${d}`, `@@ROWCOUNT = 0 (stock ${s.st[v]})`, "hit");
      P("THROW 56001 → CATCH → ROLLBACK TRANSACTION", "no quedó nada a medias", "hit");
      s.last.res = ER(56001, "Stock insuficiente: la vacunacion no se registro.") + `<small>TransaccionesAbiertas = 0 · el stock sigue en ${s.st[v]}.</small>`;
      missionFlag("e1_mis", "s"); return;
    }
    P(`UPDATE StockVacuna SET Stock = Stock - ${d}`, `stock ${s.st[v]} → ${s.st[v] - d} (aún sin confirmar)`, "good");
    if (inact) {
      P("EXEC dbo.usp_RegistrarAtencion (Tema 01)", "PAC-003 inactivo → THROW 50033", "hit");
      P("CATCH: XACT_STATE() <> 0 → ROLLBACK TRANSACTION", `el stock vuelve a ${s.st[v]}`, "hit");
      s.last.res = ER(50033, "El paciente se encuentra inactivo.") + `<small>El error vino de otro procedimiento y aun así se revirtió el descuento: stock = ${s.st[v]}.</small>`;
      missionFlag("e1_mis", "i"); return;
    }
    P("EXEC dbo.usp_RegistrarAtencion (Tema 01)", "atención registrada (y auditada por el trigger del Tema 02)", "good");
    P("INSERT DispensacionVacuna", "dispensación registrada", "good");
    const rest = s.st[v] - d;
    P("SAVE TRANSACTION AntesDeAlerta", "punto de guardado", "good");
    let msg = "";
    if (s.f) { P("THROW 56004 (fallo simulado, ANTES del INSERT de la alerta)", "salta al CATCH interno", "hit"); P("CATCH interno: XACT_STATE() = 1", "la transacción sigue confirmable", "pass"); P("ROLLBACK TRANSACTION AntesDeAlerta", "vuelve al punto de guardado: no había alerta que deshacer", "good"); msg = " No se generó una nueva alerta. En Mensajes: «No se pudo registrar la alerta; la vacunación se mantiene.» <small>Supuesto de esta prueba: transacción confirmable (XACT_ABORT OFF). Si XACT_STATE() fuera -1, no se puede volver al punto de guardado: el CATCH interno relanza el error y el CATCH externo revierte todo.</small>"; if (rest < MIN[v]) missionFlag("e1_mis", "p"); }
    else if (rest < MIN[v]) { P(`IF ${rest} < ${MIN[v]} → INSERT AlertaStock`, "alerta de stock bajo", "good"); s.al.push({ v, r: rest }); missionFlag("e1_mis", "a"); }
    else P(`IF ${rest} < ${MIN[v]}`, "falso → sin alerta", "pass");
    P("COMMIT TRANSACTION", "@@TRANCOUNT = 0", "good");
    s.st[v] = rest; s.dis++;
    s.last.res = GOOD(`Vacunación registrada · StockRestante = ${rest}.`) + (msg ? `<div class="key">${msg}</div>` : "");
    if (!s.f && !inact) missionFlag("e1_mis", "o");
  },
  out(s) {
    let h = s.last ? `<div class="cascade">${s.last.st.map((x, i) => cas(i + 1, x[0], x[2], x[1])).join("")}</div>${s.last.res}` : `<p class="lbl">Elige los parámetros y ejecuta el procedimiento.</p>`;
    h += `<div class="two" style="margin-top:8px"><div><p class="lbl">dbo.StockVacuna (EST-001)</p>${TBL(["Vacuna", "Stock", "Mínimo"], [["INFLUENZA", s.st.INFLUENZA, 3], ["HEPATITIS B", s.st["HEPATITIS B"], 2]])}</div>`;
    h += `<div><p class="lbl">dbo.AlertaStock · dispensaciones: ${s.dis}</p>${TBL(["#", "Vacuna", "StockRestante"], s.al.length ? s.al.map((r, i) => [i + 1, r.v, r.r]) : [["", "<i>sin alertas</i>", ""]])}</div></div>`;
    return h;
  }
};

const PERF = {
  analista: { "SELECT dbo.Atencion": "GRANT" },

};
const SYSA = "Tu login (sysadmin de la instancia, sin EXECUTE AS)";
const OPS = ["SELECT dbo.Atencion", "DELETE dbo.Atencion", "UPDATE dbo.Atencion", "SELECT dbo.AuditoriaAtencion", "UPDATE dbo.StockVacuna", "EXEC dbo.usp_DispensarVacuna"];
SIMS.perm = {
  init: () => ({ u: "login_analista", o: OPS[0] }),
  ctl: s => `<div class="ctlrow">${sel("perm", "u", "Identidad que ejecuta", ["login_analista", "login_auditor", "login_administrador", SYSA], s.u)}${sel("perm", "o", "Operación", OPS, s.o)}</div>`,
  out(s) {
    if (s.u === SYSA) {
      let h = `<div class="cascade">${cas(1, `${s.o}  (sin EXECUTE AS: tu propio login)`, "pass", "permitido")}</div>`;
      h += GOOD("Operación permitida. Tu login es <b>sysadmin</b> de la instancia: SQL Server no aplica las comprobaciones de permisos de la base a un sysadmin.");
      h += `<div class="key">Por eso un <code>UPDATE dbo.StockVacuna ...</code> ejecutado fuera de <code>EXECUTE AS</code> (o después de <code>REVERT</code>) sí funciona. La prueba del laboratorio va <b>entre</b> <code>EXECUTE AS LOGIN = 'login_administrador'</code> y <code>REVERT</code>: ahí se aplican los permisos de rol_administrador y el UPDATE directo da el error 229.</div>`;
      return h;
    }
    const p = s.u.replace("login_", ""), st = PERF[p][s.o];
    let why, ok;
    if (st === "DENY") { ok = false; why = `rol_${p} tiene <b>DENY</b> explícito: gana sobre cualquier GRANT.`; }
    else if (st === "GRANT") { ok = true; why = `rol_${p} tiene <b>GRANT</b> sobre esa operación.`; }
    else { ok = false; why = `rol_${p} <b>no tiene GRANT</b> sobre esa operación: se rechaza por ausencia de permiso, no por un DENY.`; }
    let h = `<div class="cascade">${cas(1, `${s.o.split(" ")[0]} … ${s.o.split(" ")[1]}  (EXECUTE AS LOGIN = '${s.u}')`, ok ? "pass" : "hit", ok ? "permitido" : "rechazado")}</div>`;
    h += ok ? GOOD("Operación permitida. " + why) : ER(229, `The ${s.o.split(" ")[0] === "EXEC" ? "EXECUTE" : s.o.split(" ")[0]} permission was denied on the object '${s.o.split(".")[1]}'.`) + (ok ? "" : `<small>${why}</small>`);
    if (s.o === "UPDATE dbo.StockVacuna" && p === "administrador") h += `<div class="key">login_administrador (el perfil del laboratorio) no es el administrador de la instancia: solo tiene los permisos de rol_administrador. Puede mover el stock únicamente con <code>EXEC dbo.usp_DispensarVacuna</code>. Al terminar la prueba, <code>REVERT</code> te devuelve tu identidad.</div>`;
    h += `<p class="lbl" style="margin-top:8px">Permisos de rol_${p} (Paso 3)</p>` + TBL(["Operación", "Estado"], OPS.map(o => [o, PERF[p][o] ? `<b>${PERF[p][o]}</b>` : "SIN GRANT"])) + `<small>GRANT = concedido · DENY = negado explícitamente · SIN GRANT = no hay autorización (no es lo mismo que DENY).</small>`;
    return h;
  }
};

/* ---------- 1.3 DENY gana y REVOKE no niega (Ejercicio 02, Paso 5) ---------- */
SIMS.deny = {
  init: () => ({ amp: false, dn: false, cl: false, log: [], last: "" }),
  ctl: s => `<div class="toolbar">${bt("deny", "amp", "A · Rol amplio: GRANT SELECT ON SCHEMA::dbo + ADD MEMBER analista")}${bt("deny", "deny", "B · DENY SELECT ON AuditoriaAtencion TO rol_analista")}${bt("deny", "rev", "C · REVOKE SELECT ON AuditoriaAtencion FROM rol_analista")}${bt("deny", "drop", "D · Cierre: DROP MEMBER + DROP ROLE + DENY")}</div><div class="toolbar">${bt("deny", "sel", "Como analista: SELECT COUNT(*) FROM AuditoriaAtencion", "pri")}${bt("deny", "reset", "Reiniciar", "ghost")}</div>`,
  act(s, a) {
    if (a === "reset") { Object.assign(s, SIMS.deny.init()); return; }
    if (a === "amp") { s.amp = true; s.cl = false; s.log.push("A · rol_lectura_general: GRANT SELECT ON SCHEMA::dbo; analista es miembro"); }
    if (a === "deny") { s.dn = true; s.log.push("B · DENY SELECT ON dbo.AuditoriaAtencion TO rol_analista"); }
    if (a === "rev") { s.dn = false; s.log.push("C · REVOKE SELECT ON dbo.AuditoriaAtencion FROM rol_analista  (retira el DENY; no niega)"); }
    if (a === "drop") { s.amp = false; s.dn = true; s.cl = true; s.log.push("D · DROP MEMBER y DROP ROLE rol_lectura_general; DENY SELECT ON dbo.AuditoriaAtencion TO rol_analista"); }
    if (a === "sel") {
      const ok = s.amp && !s.dn;
      s.last = ok ? GOOD("Consulta permitida, gracias al GRANT del rol amplio. La cantidad de filas dependerá de los registros existentes en dbo.AuditoriaAtencion (la simulación no cuenta filas).") : ER(229, "The SELECT permission was denied on the object 'AuditoriaAtencion'.") + `<small>${s.dn ? (s.amp ? "DENY gana aunque exista un GRANT por otro rol." : "Rechazo por DENY explícito: la política queda escrita y protege frente a roles futuros.") : "Rechazo por ausencia de permiso (SIN GRANT): no existe un DENY."}</small>`;
      if (ok && s.log.some(l => l.startsWith("C ·"))) missionFlag("e2_mis", "r");
      else if (ok) missionFlag("e2_mis", "g");
      if (!ok && s.amp && s.dn) missionFlag("e2_mis", "d");
      if (!ok && s.cl && !s.amp && s.dn) missionFlag("e2_mis", "f");
    }
    if (s.log.length > 6) s.log = s.log.slice(-6);
  },
  out(s) {
    const src = [["GRANT directo de rol_analista sobre AuditoriaAtencion", "No (desde el Paso 3: SIN GRANT)"], ["GRANT por rol_lectura_general (SCHEMA::dbo)", s.amp ? "Sí" : "No"], ["DENY en rol_analista sobre AuditoriaAtencion", s.dn ? "<b>Sí</b>" : "No"]];
    const eff = s.dn ? (s.amp ? "Rechazado: DENY explícito (gana sobre el GRANT del rol amplio)" : "Rechazado: DENY explícito") : s.amp ? "Permitido (por el GRANT del rol amplio)" : "Rechazado: SIN GRANT (no es un DENY)";
    let h = TBL(["Fuente de permiso del analista", "¿Existe?"], src) + `<p style="margin:8px 0"><span class="pill dark">Resultado efectivo: ${eff}</span></p>`;
    if (s.last) h += s.last;
    h += `<div class="out" style="margin-top:8px">${s.log.length ? s.log.map(esc).join("\n") : "Estado inicial (Paso 3): el analista no tiene GRANT sobre la auditoría. Orden sugerido: A → SELECT → B → SELECT → C → SELECT → D → SELECT."}</div>`;
    return h;
  }
};

/* ---------- 1.4 Columna sensible y registro de consultas (Ejercicio 03) ---------- */
const QRY = ["SELECT PacienteId, NivelRiesgo, FechaRegistro", "SELECT PacienteId, Diagnostico", "SELECT *", "EXEC usp_ConsultarDetalleClinico 'PAC-002'", "EXEC usp_ConsultarDetalleClinico 'PAC-999'"];
SIMS.col = {
  init: () => ({ u: "login_analista", q: QRY[0], r1: true, r2: true, r3: true, r4: true, log: [] }),
  ctl: s => `<div class="ctlrow">${sel("col", "u", "EXECUTE AS LOGIN =", ["login_analista", "login_auditor", "login_administrador"], s.u)}${sel("col", "q", "Consulta sobre el detalle clínico", QRY, s.q)}</div><div class="toolbar"><span class="lbl">Tu solución incluye:</span>${chk("col", "r1", "R1", s.r1)}${chk("col", "r2", "R2", s.r2)}${chk("col", "r3", "R3", s.r3)}${chk("col", "r4", "R4", s.r4)}${bt("col", "run", "Ejecutar", "pri")}${bt("col", "reset", "Reiniciar", "ghost")}</div>`,
  act(s, a) {
    if (a === "reset") { Object.assign(s, SIMS.col.init()); return; }
    const p = s.u.replace("login_", ""), q = s.q, isExec = q.startsWith("EXEC");
    let r;
    if (isExec) {
      const canExec = p === "administrador" && s.r4 && s.r3;
      if (!s.r3) r = ER(2812, "Could not find stored procedure 'dbo.usp_ConsultarDetalleClinico'.");
      else if (!canExec) r = ER(229, "The EXECUTE permission was denied on the object 'usp_ConsultarDetalleClinico'.");
      else if (q.includes("999")) r = ER(57001, "El paciente indicado no existe.");
      else { s.log.push(s.u); r = GOOD("1 fila de PAC-002 con Diagnostico · y 1 registro nuevo en LogAccesoPaciente."); }
    } else {
      const diag = q !== QRY[0];
      if (p === "analista") r = !s.r1 ? ER(229, "The SELECT permission was denied on the object 'DetalleClinicoRestringido'.") : diag ? ER(230, "The SELECT permission was denied on the column 'Diagnostico' of the object 'DetalleClinicoRestringido'.") : GOOD("3 filas: PacienteId, NivelRiesgo y FechaRegistro.");
      else if (p === "auditor") r = ER(229, "The SELECT permission was denied on the object 'DetalleClinicoRestringido'.") + (s.r2 ? "<small>R2: DENY explícito.</small>" : "<small>Sin R2 también falla (no tiene GRANT), pero la política no queda escrita: un rol futuro podría darle acceso.</small>");
      else r = s.r4 ? ER(229, "The SELECT permission was denied on the object 'DetalleClinicoRestringido'.") + "<small>R4: la lectura directa está cerrada; solo por el procedimiento, que registra.</small>" : `<div class="er"><b>El administrador leyó el detalle sin dejar registro.</b> Falta R4: DENY SELECT sobre la tabla.</div>`;
    }

  },
  out(s) {
    let h = s.res || `<p class="lbl">Elige quién consulta y qué consulta; marca qué requerimientos ya implementaste.</p>`;

  }

/* ---------- 1.5 Plan de ejecución (Ejercicio 04) ---------- */
const IDX = ["Solo la clave primaria (sin tu índice)", "(EstablecimientoId, FechaAtencion)", "(FechaAtencion, EstablecimientoId)", "(EstablecimientoId, FechaAtencion) INCLUDE (TipoAtencion, DuracionMinutos)"];
SIMS.plan = {
  init: () => ({ q: "Consulta A", i: IDX[0] }),
  ctl: s => `<div class="ctlrow">${sel("plan", "q", "Consulta", ["Consulta A", "Consulta B"], s.q)}${sel("plan", "i", "Índice disponible", IDX, s.i)}</div>`,
  out(s) {
    const A = s.q === "Consulta A", k = IDX.indexOf(s.i), filas = A ? 96 : 41;
    let ops, reads, note;
    if (k === 0) { ops = [["Clustered Index Scan", "recorre las 50 000 filas", "hit"]]; reads = "≈ 300"; note = "Lee todas las páginas para devolver muy pocas filas."; }
    else if (k === 1) {
      if (A) { ops = [["Index Seek (IX…_Establecimiento_Fecha)", "salta al establecimiento 17 y recorre solo julio", "good"]]; reads = "2 a 3"; note = "El índice cubre la consulta A: todas sus columnas están en el índice (la clave primaria viaja incluida)."; }
      else { ops = [["Index Seek (IX…_Establecimiento_Fecha)", "encuentra las 41 filas", "good"], ["Key Lookup (Clustered)", "vuelve a la tabla 41 veces por TipoAtencion y DuracionMinutos", "hit"], ["Nested Loops", "une ambos resultados", "pass"]]; reads = "≈ 85"; note = "Faltan columnas del SELECT en el índice: cada fila cuesta una lectura extra."; }
    } else if (k === 2) { ops = [["Index Seek (por FechaAtencion)", "recorre el rango de fechas de los 50 establecimientos", "pass"], ["Predicado residual EstablecimientoId = 17", "descarta la mayoría de lo leído", "hit"]].concat(A ? [] : [["Key Lookup (Clustered)", "41 veces", "hit"]]); reads = A ? "≈ 15" : "≈ 95"; note = "Mejora, pero el rango va primero: no puede saltar directo al establecimiento."; }
    else { ops = [["Index Seek (IX…_Establecimiento_Fecha con INCLUDE)", "encuentra las filas y ya tiene todas las columnas", "good"]]; reads = "2 a 3"; note = "INCLUDE guarda TipoAtencion y DuracionMinutos en el índice: no hay Key Lookup."; }
    let h = `<div class="cascade">${ops.map((x, i) => cas(i + 1, x[0], x[2], x[1])).join("")}</div>`;
    h += TBL(["Operador principal", "Lecturas lógicas (aprox.)", "Filas"], [[ops.map(o => o[0].split(" (")[0]).join(" + "), reads, filas]]);
    h += `<div class="key">${note}</div><small>Valores aproximados: en tu equipo las lecturas pueden variar; el cambio de operador es lo que debes observar.</small>`;
    return h;
  }
};

/* ---------- 1.6 Línea de tiempo de respaldos (Ejercicio 05) ---------- */
SIMS.bak = {
  init: () => ({ rows: [1], bk: [], rs: null, rsRows: [], msg: "" }),
  ctl: s => `<div class="toolbar">${bt("bak", "ins", "INSERT fila de evidencia")}${bt("bak", "full", "BACKUP FULL")}${bt("bak", "diff", "BACKUP DIFFERENTIAL")}</div><div class="toolbar">${bt("bak", "rfn", "RESTORE FULL WITH NORECOVERY")}${bt("bak", "rfr", "RESTORE FULL WITH RECOVERY")}${bt("bak", "rd", "RESTORE DIFF WITH RECOVERY", "pri")}${bt("bak", "reset", "Reiniciar", "ghost")}</div>`,
  act(s, a) {
    s.msg = "";
    if (a === "reset") { Object.assign(s, SIMS.bak.init()); return; }
    if (a === "ins") s.rows.push(s.rows.length + 1);
    if (a === "full") { s.bk.push({ t: "FULL", rows: [...s.rows] }); missionFlag("e5_mis", "f"); }
    if (a === "diff") { if (!s.bk.some(b => b.t === "FULL")) { s.msg = ER(3035, "Cannot perform a differential backup ... because a current database backup does not exist."); return; } s.bk.push({ t: "DIFF", rows: [...s.rows] }); missionFlag("e5_mis", "d"); }
    const lastFull = [...s.bk].reverse().find(b => b.t === "FULL");
    if (a === "rfn" || a === "rfr") { if (!lastFull) { s.msg = ER(3201, "No hay archivo FULL: primero haz el respaldo."); return; } s.rs = a === "rfn" ? "RESTAURANDO" : "EN LÍNEA"; s.rsRows = [...lastFull.rows]; }
    if (a === "rd") {
      const diff = [...s.bk].reverse().find(b => b.t === "DIFF");
      if (!diff) { s.msg = ER(3201, "No hay archivo DIFF: primero haz el respaldo diferencial."); return; }
      if (s.rs !== "RESTAURANDO") { s.msg = ER(3117, "The log or differential backup cannot be restored because no files are ready to rollforward.") + "<small>El FULL debe restaurarse con NORECOVERY.</small>"; return; }
      s.rs = "EN LÍNEA"; s.rsRows = [...diff.rows]; missionFlag("e5_mis", "r");
      if (s.rows.length > s.rsRows.length) missionFlag("e5_mis", "p");
    }
  },
  out(s) {
    const lost = s.rs === "EN LÍNEA" ? s.rows.filter(r => !s.rsRows.includes(r)) : [];
    let h = `<div class="two"><div><p class="lbl">BDDataSaludTema01 (original)</p>${TBL(["EvidenciaId"], s.rows.map(r => [r]))}</div><div><p class="lbl">BDDataSaludTema03_Restore · ${s.rs ? `<b>${s.rs}</b>` : "no existe"}</p>${TBL(["EvidenciaId"], s.rs === "EN LÍNEA" ? s.rsRows.map(r => [r]) : [[s.rs ? "<i>no se puede consultar todavía</i>" : "<i>—</i>"]])}</div></div>`;
    h += `<p class="lbl" style="margin-top:8px">Respaldos</p>` + TBL(["#", "Tipo", "Contiene las filas"], s.bk.length ? s.bk.map((b, i) => [i + 1, b.t, b.rows.join(", ")]) : [["", "<i>ninguno</i>", ""]]);
    if (s.msg) h += s.msg;
    if (lost.length) h += `<div class="key">Se perdió la fila ${lost.join(", ")}: se insertó después del último respaldo. Eso mide el punto de recuperación.</div>`;
    return h;
  }
};

function A(id) { return S.a[id] || (S.a[id] = { tries: 0, hints: 0, solved: false, first: false, sol: false, exp: false, val: {} }); }

function stats(ids) { const st = ids.map(A); return { n: ids.length, solved: st.filter(s => s.solved).length, first: st.filter(s => s.first).length, hints: st.reduce((a, s) => a + s.hints, 0), sols: st.filter(s => s.sol).length }; }

  if (!st.some(s => s.tries || s.solved || s.hints || s.sol)) return "pen";
  return st.every(s => s.solved) && !st.some(s => s.sol) && st.reduce((a, s) => a + s.hints, 0) <= ids.length ? "dom" : "rep";

const hintHTML = (t, i) => `<div class="hint"><span class="h">${HN[i]}</span>${esc(t)}</div>`;

const expHTML = d => `<div class="exp"><span class="h">Explicación</span>${d.exp}</div>`;
function actBody(id) {
  const d = ACT[id], v = A(id).val;
  let b = "";
  if (d.sim && d.type !== "mission") b += SIMTAG + `<div class="simbox" data-sim="${d.sim}" style="margin-bottom:14px"></div>`;
  switch (d.type) {
    case "choice": case "multi":
      b += `<div class="opts" role="group">${d.opts.map((o, i) => { const on = d.type === "choice" ? v.pick === i : (v.picks || []).includes(i); return `<button type="button" class="opt ${d.type === "multi" ? "multi" : ""}" data-act="${id}" data-opt="${i}" aria-pressed="${on}"><span class="mk" aria-hidden="true"></span><span>${esc(o.t)}</span></button>`; }).join("")}</div>`;
      if (d.type === "multi") b += `<small>Puedes marcar varias opciones.</small>`; break;
    case "match":
      b += `<div class="grid-m">${d.items.map((it, i) => `<div class="it">${esc(it.l)}</div><select id="${id}-m${i}" data-act="${id}" data-k="m${i}" aria-label="${esc(it.l)}"><option value="">Elige…</option>${d.choices.map(c => `<option${v["m" + i] === c ? " selected" : ""}>${esc(c)}</option>`).join("")}</select>`).join("")}</div>`; break;
    case "fill": {
      const parts = d.code.split(/\[\[(\w+)\]\]/), keys = Object.keys(d.blanks);
      let code = "";
      parts.forEach((p, i) => { if (i % 2 === 0) code += hl(p, d.lang); else { const bl = d.blanks[p], w = Math.max(bl.w || 8, (v[p] || "").length + 1); code += `<input class="blank" id="${id}-${p}" data-act="${id}" data-k="${p}" value="${esc(v[p] || "")}" size="${w}" spellcheck="false" autocomplete="off" aria-label="Espacio ${keys.indexOf(p) + 1}">`; } });
      b += `<div class="cw"><div class="cbar"><span>Completa los espacios · se compara con respuestas admitidas (no se ejecuta)</span></div><pre class="code">${code}</pre></div>`; break;
    }
    case "fields":
      b += `<div class="fields">${d.fields.map(f => { const val = v[f.k] || ""; if (f.kind === "select") return `<label for="${id}-${f.k}">${esc(f.l)}<select id="${id}-${f.k}" data-act="${id}" data-k="${f.k}"><option value="">Elige…</option>${f.opts.map(o => `<option${val === o ? " selected" : ""}>${esc(o)}</option>`).join("")}</select></label>`;
        return `<label for="${id}-${f.k}">${esc(f.l)}<input class="f" id="${id}-${f.k}" data-act="${id}" data-k="${f.k}" value="${esc(val)}" ${f.kind === "num" ? 'inputmode="decimal"' : ""} autocomplete="off" spellcheck="false"></label>`; }).join("")}</div>`; break;
    case "text":
      b += `<div class="fields wide">${d.parts.map(p => `<label for="${id}-${p.k}">${esc(p.l)}<textarea id="${id}-${p.k}" data-act="${id}" data-k="${p.k}">${esc(v[p.k] || "")}</textarea></label>`).join("")}</div><small>Se revisa que nombres las ideas clave; la redacción es tuya.</small>`; break;
    case "mission":
      b += SIMTAG + `<div class="simbox" data-sim="${d.sim}"></div><h4 style="margin:14px 0 6px;font-size:.9rem">Tareas</h4><ul class="checkl" id="${id}-mis">${missionItems(id)}</ul>`; break;
    case "cards":
      b += `<div class="reccards">${d.cards.map((c, i) => `<div class="reccard" id="${id}-card${i}"><div class="rec">${esc(c.rec)}</div><select id="${id}-c${i}" data-act="${id}" data-k="c${i}" aria-label="Motivo de: ${esc(c.rec)}"><option value="">Elige…</option>${d.opts.map(o => `<option${v["c" + i] === o ? " selected" : ""}>${esc(o)}</option>`).join("")}</select><div class="why" id="${id}-why${i}"></div></div>`).join("")}</div>`; break;
  }
  return b;
}
function actHTML(id, as, n) {
  const d = ACT[id], st = A(id);
